/* ---------------------------------------------------------------
   SYNCHRONIZACJA Z GITHUBEM
   Dane trzymane są w pliku JSON w prywatnym repozytorium.
   --------------------------------------------------------------- */
const b64 = {
  koduj(tekst) {
    const bajty = new TextEncoder().encode(tekst);
    let s = "";
    for (let i = 0; i < bajty.length; i += 0x8000) {
      s += String.fromCharCode.apply(null, bajty.subarray(i, i + 0x8000));
    }
    return btoa(s);
  },
  dekoduj(dane) {
    const czyste = String(dane).replace(/\s/g, "");
    const bajty = Uint8Array.from(atob(czyste), (z) => z.charCodeAt(0));
    return new TextDecoder().decode(bajty);
  },
};

const github = {
  adres(k) {
    return `https://api.github.com/repos/${k.wlasciciel}/${k.repo}/contents/${k.sciezka}`;
  },

  naglowki(k) {
    return {
      Authorization: `Bearer ${k.token}`,
      Accept: "application/vnd.github+json",
      "X-GitHub-Api-Version": "2022-11-28",
    };
  },

  async pobierz(k) {
    const odp = await fetch(`${this.adres(k)}?ref=${k.galaz || "main"}`, { headers: this.naglowki(k) });
    if (odp.status === 404) return { istnieje: false };
    if (!odp.ok) throw new Error(this.opisBledu(odp.status));
    const dane = await odp.json();
    return { istnieje: true, sha: dane.sha, tresc: JSON.parse(b64.dekoduj(dane.content)) };
  },

  async wyslij(k, obiekt, sha) {
    const odp = await fetch(this.adres(k), {
      method: "PUT",
      headers: { ...this.naglowki(k), "Content-Type": "application/json" },
      body: JSON.stringify({
        message: `Dziennik — zapis ${new Date().toISOString().slice(0, 16).replace("T", " ")}`,
        content: b64.koduj(JSON.stringify(obiekt, null, 2)),
        branch: k.galaz || "main",
        ...(sha ? { sha } : {}),
      }),
    });
    if (!odp.ok) throw new Error(this.opisBledu(odp.status));
    return true;
  },

  opisBledu(status) {
    if (status === 401) return "Token odrzucony — wygasł albo jest błędny.";
    if (status === 403) return "Brak uprawnień do zapisu w tym repozytorium.";
    if (status === 404) return "Nie znaleziono repozytorium. Sprawdź właściciela i nazwę.";
    if (status === 409) return "Konflikt wersji — pobierz dane z GitHuba i spróbuj ponownie.";
    if (status === 422) return "Odrzucone przez GitHuba — sprawdź nazwę gałęzi.";
    return `Błąd połączenia (${status}).`;
  },
};

/* ---------------------------------------------------------------
   POMOCNICZE
   --------------------------------------------------------------- */
const dzis = () => new Date().toISOString().slice(0, 10);
const MIES = ["sty", "lut", "mar", "kwi", "maj", "cze", "lip", "sie", "wrz", "paź", "lis", "gru"];

const formatData = (iso) => {
  const [r, m, d] = iso.split("-");
  return `${parseInt(d, 10)} ${MIES[parseInt(m, 10) - 1]} ${r}`;
};

const dniTemu = (iso) => {
  const roznica = Math.round((new Date(dzis()) - new Date(iso)) / 86400000);
  if (roznica === 0) return "dziś";
  if (roznica === 1) return "wczoraj";
  return `${roznica} dni temu`;
};

const mmss = (sekundy) => {
  const s = Math.max(0, Math.round(sekundy));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
};

const pusteSerie = () => ({ w: "", p: "", w2: "", p2: "" });

const wypelniona = (s) =>
  s && (s.w !== "" || s.p !== "" || s.w2 !== "" || s.p2 !== "");

/** Tekstowy zapis jednej serii, np. „56kg×8” albo „30s L / 28s P”. */
const opisSerii = (cw, s, strony) => {
  const jedn = cw.jedn;
  const jednP = cw.jednPowt || "";
  const jedna = (w, p) => {
    if (cw.bezPowtorzen) return `${w || "–"}${jedn}`;
    return `${w || "–"}${jedn}×${p || "–"}${jednP}`;
  };
  if (strony && cw.jednostronne) {
    return `${jedna(s.w, s.p)} L / ${jedna(s.w2, s.p2)} P`;
  }
  return jedna(s.w, s.p);
};

const topSeria = (serie) => {
  const wazne = (serie || []).filter((s) => s && s.w !== "" && s.w != null);
  if (!wazne.length) return null;
  return wazne.reduce((a, b) => (parseFloat(b.w) > parseFloat(a.w) ? b : a));
};

  trójka: 3, trojka: 3, trójkę: 3, trojke: 3,

  dwudziestka: 20, dwudziestkę: 20, dwudziestke: 20,
};
const SETKI = {
  sto: 100, dwieście: 200, dwiescie: 200, trzysta: 300, czterysta: 400,
  pięćset: 500, piecset: 500,
};

function wyciagnijLiczby(tekst) {
  const slowa = String(tekst).toLowerCase().replace(/[,.]/g, " ").split(/\s+/).filter(Boolean);
  const liczby = [];
  let biezaca = null;
  const zamknij = () => {
    if (biezaca != null) { liczby.push(biezaca); biezaca = null; }
  };

  for (const s of slowa) {
    if (/^\d+$/.test(s)) { zamknij(); liczby.push(parseInt(s, 10)); continue; }
    const wartosc = SETKI[s] ?? DZIESIATKI[s] ?? NASTKI[s] ?? RZECZOWNIKOWE[s] ?? JEDNOSTKI[s] ?? null;
    if (wartosc != null) {
      if (biezaca == null) biezaca = wartosc;
      else if (wartosc < 10 && biezaca % 10 === 0) biezaca += wartosc;
      else if (wartosc < 100 && biezaca % 100 === 0) biezaca += wartosc;
      else { zamknij(); biezaca = wartosc; }
      continue;
    }
    if (s === "pół" || s === "pol" || s === "połową" || s === "polowa") {
      if (liczby.length && biezaca == null) liczby[liczby.length - 1] += 0.5;
      else if (biezaca != null) biezaca += 0.5;
      continue;
    }
    if (s === "i" || s === "z") continue;
    zamknij();
  }
  zamknij();
  return liczby;
}

/* ---------------------------------------------------------------
   WARSTWA ZAPISU
   Kolejno próbuje: pamięć artefaktu → pamięć przeglądarki → pamięć sesji.
   --------------------------------------------------------------- */
const magazyn = {
  rodzaj: null,
  szczegol: "",

  async wykryj() {
    try {
      if (typeof window !== "undefined" && window.storage && typeof window.storage.set === "function") {
        await window.storage.set("dziennik:test", "1");
        this.rodzaj = "artefakt";
        return;
      }
    } catch (e) {
      this.szczegol = String(e && e.message ? e.message : e);
    }
    try {
      if (typeof window !== "undefined" && window.localStorage) {
        window.localStorage.setItem("dziennik:test", "1");
        window.localStorage.removeItem("dziennik:test");
        this.rodzaj = "przegladarka";
        return;
      }
    } catch (e) {
      this.szczegol = this.szczegol || String(e && e.message ? e.message : e);
    }
    this.rodzaj = "pamiec";
  },

  async czytaj(klucz) {
    if (this.rodzaj === "artefakt") {
      try {
        const w = await window.storage.get(klucz);
        return w && w.value ? w.value : null;
      } catch (e) { return null; }
    }
    if (this.rodzaj === "przegladarka") {
      try { return window.localStorage.getItem(klucz); } catch (e) { return null; }
    }
    return (this._ulotne || {})[klucz] || null;
  },

  async pisz(klucz, tekst) {
    if (this.rodzaj === "artefakt") {
      for (let i = 0; i < 2; i++) {
        try {
          const w = await window.storage.set(klucz, tekst);
          if (w) return true;
        } catch (e) { this.szczegol = String(e && e.message ? e.message : e); }
        await new Promise((r) => setTimeout(r, 400));
      }
      return false;
    }
    if (this.rodzaj === "przegladarka") {
      try { window.localStorage.setItem(klucz, tekst); return true; } catch (e) { return false; }
    }
    this._ulotne = { ...(this._ulotne || {}), [klucz]: tekst };
    return true;
  },
};

const OPIS_MAGAZYNU = {
  artefakt: { etykieta: "pamięć Claude", trwale: true, opis: "Dane są przypisane do konta i widoczne na każdym urządzeniu." },
  przegladarka: { etykieta: "pamięć przeglądarki", trwale: true, opis: "Dane zostają w tej przeglądarce na tym urządzeniu. Nie zobaczysz ich po zalogowaniu gdzie indziej." },
  pamiec: { etykieta: "tylko ta sesja", trwale: false, opis: "Zapis trwały nie działa w tym oknie. Po zamknięciu dane przepadną — kopiuj podsumowanie i przenieś je przez zakładkę „Wklej” w oknie, gdzie zapis działa." },
};

/* ---------------------------------------------------------------
   APLIKACJA
   --------------------------------------------------------------- */
function DziennikTreningowy() {
  const [sesje, setSesje] = useState([]);
  const [wskazowki, setWskazowki] = useState({ A: "", B: "" });
  const [ladowanie, setLadowanie] = useState(true);
  const [awaria, setAwaria] = useState(null);
  const [rodzajZapisu, setRodzajZapisu] = useState(null);
  const [konfigGH, setKonfigGH] = useState(null);
  const [motyw, setMotyw] = useState("multicam");
  const [nadpisania, setNadpisania] = useState({});
  const [dodane, setDodane] = useState({ A: [], B: [] });
  const [kolejnosc, setKolejnosc] = useState({ A: [], B: [] });
  const [stanGH, setStanGH] = useState({ etap: "bezczynny", tekst: "" });
  const [widok, setWidok] = useState("start");
  const [aktywna, setAktywna] = useState(null);

  useEffect(() => {
    (async () => {
      await magazyn.wykryj();
      setRodzajZapisu(magazyn.rodzaj);
      try {
        const surowe = await magazyn.czytaj(KLUCZ);
        if (surowe) setSesje(JSON.parse(surowe));
      } catch (e) {
        // pierwsze uruchomienie — brak danych to normalna sytuacja
      }
      try {
        const w = await magazyn.czytaj(KLUCZ_WSK);
        if (w) setWskazowki({ A: "", B: "", ...JSON.parse(w) });
      } catch (e) {
        // brak wskazówek to też normalna sytuacja
      }
      try {
        const g = await magazyn.czytaj(KLUCZ_GH);
        if (g) setKonfigGH(JSON.parse(g));
      } catch (e) {
        // brak konfiguracji synchronizacji
      }
      try {
        const k = await magazyn.czytaj(KLUCZ_KOLEJNOSC);
        if (k) setKolejnosc({ A: [], B: [], ...JSON.parse(k) });
      } catch (e) {
        // brak zapisanej kolejności
      }
      try {
        const d = await magazyn.czytaj(KLUCZ_DODANE);
        if (d) setDodane({ A: [], B: [], ...JSON.parse(d) });
      } catch (e) {
        // brak dodanych ćwiczeń
      }
      try {
        const n = await magazyn.czytaj(KLUCZ_PLAN);
        if (n) setNadpisania(JSON.parse(n));
      } catch (e) {
        // brak nadpisań planu
      }
      try {
        const m = await magazyn.czytaj(KLUCZ_MOTYW);
        if (m && MOTYWY[m]) {
          C = { ...MOTYWY[m] };
          setMotyw(m);
        }
      } catch (e) {
        // brak zapisanego motywu — zostaje domyślny
      }
      setLadowanie(false);
    })();
  }, []);

  const zmienMotyw = async () => {
    const kolejny = motyw === "multicam" ? "papier" : "multicam";
    C = { ...MOTYWY[kolejny] };
    setMotyw(kolejny);
    document.body.style.background = C.paper;
    await magazyn.pisz(KLUCZ_MOTYW, kolejny);
  };

  useEffect(() => {
    document.body.style.background = C.paper;
  }, [motyw]);

  const zapisz = async (noweSesje) => {
    setSesje(noweSesje);
    const ok = await magazyn.pisz(KLUCZ, JSON.stringify(noweSesje));
    setAwaria(ok ? null : { szczegol: magazyn.szczegol });
    wyslijDoGH(noweSesje, wskazowki, nadpisania, dodane, kolejnosc);
    return ok;
  };

  const zapiszWskazowki = async (plan, tekst) => {
    const nowe = { ...wskazowki, [plan]: tekst };
    setWskazowki(nowe);
    await magazyn.pisz(KLUCZ_WSK, JSON.stringify(nowe));
    wyslijDoGH(sesje, nowe, nadpisania, dodane, kolejnosc);
  };

  const zapiszNadpisanie = async (cwId, pola) => {
    const nowe = { ...nadpisania, [cwId]: { ...(nadpisania[cwId] || {}), ...pola } };
    setNadpisania(nowe);
    await magazyn.pisz(KLUCZ_PLAN, JSON.stringify(nowe));
    wyslijDoGH(sesje, wskazowki, nowe, dodane, kolejnosc);
  };

  const zapiszKolejnosc = async (plan, idki) => {
    const nowe = { ...kolejnosc, [plan]: idki };
    setKolejnosc(nowe);
    await magazyn.pisz(KLUCZ_KOLEJNOSC, JSON.stringify(nowe));
    wyslijDoGH(sesje, wskazowki, nadpisania, dodane, nowe);
  };

  const zapiszDodane = async (nowe) => {
    setDodane(nowe);
    await magazyn.pisz(KLUCZ_DODANE, JSON.stringify(nowe));
    wyslijDoGH(sesje, wskazowki, nadpisania, nowe, kolejnosc);
  };

  const dodajCwiczenie = (plan, cwId) => {
    if ((dodane[plan] || []).includes(cwId)) return;
    zapiszDodane({ ...dodane, [plan]: [...(dodane[plan] || []), cwId] });
  };

  const usunCwiczenie = (plan, cwId) => {
    zapiszDodane({ ...dodane, [plan]: (dodane[plan] || []).filter((x) => x !== cwId) });
  };

  const zapiszKonfigGH = async (k) => {
    setKonfigGH(k);
    await magazyn.pisz(KLUCZ_GH, JSON.stringify(k));
  };

  const gotowyGH = (k) => k && k.token && k.wlasciciel && k.repo && k.sciezka;

  const wyslijDoGH = async (noweSesje, noweWskazowki, noweNadpisania, noweDodane, nowaKolejnosc) => {
    const k = konfigGH;
    if (!gotowyGH(k)) return;
    setStanGH({ etap: "praca", tekst: "wysyłam…" });
    try {
      const obecne = await github.pobierz(k);
      await github.wyslij(
        k,
        { wersja: WERSJA, zapisano: new Date().toISOString(), sesje: noweSesje, wskazowki: noweWskazowki, plan: noweNadpisania || nadpisania, dodane: noweDodane || dodane, kolejnosc: nowaKolejnosc || kolejnosc },
        obecne.istnieje ? obecne.sha : null
      );
      setStanGH({ etap: "ok", tekst: `wysłano ${new Date().toTimeString().slice(0, 5)}` });
    } catch (e) {
      setStanGH({ etap: "blad", tekst: e.message });
    }
  };

  const pobierzZGH = async () => {
    const k = konfigGH;
    if (!gotowyGH(k)) return;
    setStanGH({ etap: "praca", tekst: "pobieram…" });
    try {
      const wynik = await github.pobierz(k);
      if (!wynik.istnieje) {
        setStanGH({ etap: "blad", tekst: "Pliku jeszcze nie ma w repozytorium — najpierw wyślij." });
        return;
      }
      const dane = wynik.tresc || {};
      if (Array.isArray(dane.sesje)) {
        setSesje(dane.sesje);
        await magazyn.pisz(KLUCZ, JSON.stringify(dane.sesje));
      }
      if (dane.kolejnosc) {
        const k = { A: [], B: [], ...dane.kolejnosc };
        setKolejnosc(k);
        await magazyn.pisz(KLUCZ_KOLEJNOSC, JSON.stringify(k));
      }
      if (dane.dodane) {
        const d = { A: [], B: [], ...dane.dodane };
        setDodane(d);
        await magazyn.pisz(KLUCZ_DODANE, JSON.stringify(d));
      }
      if (dane.plan) {
        setNadpisania(dane.plan);
        await magazyn.pisz(KLUCZ_PLAN, JSON.stringify(dane.plan));
      }
      if (dane.wskazowki) {
        const w = { A: "", B: "", ...dane.wskazowki };
        setWskazowki(w);
        await magazyn.pisz(KLUCZ_WSK, JSON.stringify(w));
      }
      setStanGH({ etap: "ok", tekst: `pobrano ${(dane.sesje || []).length} sesji` });
    } catch (e) {
      setStanGH({ etap: "blad", tekst: e.message });
    }
  };

  const ostatniaZPlanu = (plan) =>
    sesje.filter((s) => s.plan === plan).sort((a, b) => b.data.localeCompare(a.data))[0] || null;

  const ostatnieDlaCwiczenia = (cwId, pomijajId) => {
    const posortowane = [...sesje].sort((a, b) => b.data.localeCompare(a.data));
    for (const s of posortowane) {
      if (s.id === pomijajId) continue;
      const wpis = s.wpisy?.[cwId];
      const serie = Array.isArray(wpis) ? wpis : wpis?.serie;
      if (serie && serie.some(wypelniona)) return { serie, data: s.data, strony: wpis?.strony };
    }
    return null;
  };

  const rozpocznij = (plan) => {
    const istniejaca = sesje.find((s) => s.data === dzis() && s.plan === plan);
    setAktywna(
      istniejaca || {
        id: `s_${Date.now()}`,
        data: dzis(),
        plan,
        wpisy: {},
        rozgrzewka: [],
        notatka: "",
      }
    );
    setWidok("sesja");
  };

  const zapiszSesje = async (sesja) => {
    const bez = sesje.filter((s) => s.id !== sesja.id);
    const ok = await zapisz([sesja, ...bez].sort((a, b) => b.data.localeCompare(a.data)));
    if (ok) {
      setAktywna(null);
      setWidok("start");
    }
    return ok;
  };

  const dodajSesje = async (sesja) => {
    const bez = sesje.filter((s) => !(s.data === sesja.data && s.plan === sesja.plan));
    return zapisz([sesja, ...bez].sort((a, b) => b.data.localeCompare(a.data)));
  };

  const usunSesje = (id) => zapisz(sesje.filter((s) => s.id !== id));

  if (ladowanie) {
    return (
      <div style={{ ...body, background: C.paper, color: C.ink, minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", color: C.steel }}>
        <style>{fonty()}</style>
        <span style={{ ...mono, fontSize: 13, letterSpacing: "0.08em" }}>WCZYTUJĘ…</span>
      </div>
    );
  }

  return (
    <div style={{ ...body, background: C.paper, minHeight: "100vh", color: C.ink, backgroundImage: C.kamuflaz ? KAMUFLAZ : "none", backgroundSize: C.kamuflaz ? "340px 340px" : "auto", backgroundAttachment: "fixed" }}>
      <style>{fonty()}</style>
      <div style={{ maxWidth: 560, margin: "0 auto", padding: "0 0 96px" }}>
        <Naglowek widok={widok} setWidok={setWidok} liczba={sesje.length} motyw={motyw} zmienMotyw={zmienMotyw} />

        {<PasekAwarii rodzaj={rodzajZapisu} awaria={awaria} />}

        {widok === "start" && (
          <Start sesje={sesje} wskazowki={wskazowki} stanGH={stanGH} konfigGH={konfigGH} ostatniaZPlanu={ostatniaZPlanu} rozpocznij={rozpocznij} setWidok={setWidok} />
        )}

        {widok === "sesja" && aktywna && (
          <Sesja
            sesja={aktywna}
            setSesja={setAktywna}
            wskazowka={wskazowki[aktywna.plan] || ""}
            nadpisania={nadpisania}
            zapiszNadpisanie={zapiszNadpisanie}
            dodane={dodane[aktywna.plan] || []}
            kolejnosc={kolejnosc[aktywna.plan] || []}
            zapiszKolejnosc={zapiszKolejnosc}
            dodajCwiczenie={dodajCwiczenie}
            usunCwiczenie={usunCwiczenie}
            zapiszWskazowki={zapiszWskazowki}
            ostatnieDlaCwiczenia={ostatnieDlaCwiczenia}
            zapiszSesje={zapiszSesje}
            anuluj={() => { setAktywna(null); setWidok("start"); }}
          />
        )}

        {widok === "historia" && <Historia sesje={sesje} usunSesje={usunSesje} setWidok={setWidok} />}

        {widok === "import" && <Import dodajSesje={dodajSesje} setWidok={setWidok} />}

        {widok === "chmura" && (
          <Chmura
            konfig={konfigGH}
            zapiszKonfig={zapiszKonfigGH}
            wyslij={() => wyslijDoGH(sesje, wskazowki, nadpisania, dodane, kolejnosc)}
            pobierz={pobierzZGH}
            stan={stanGH}
            sesje={sesje}
            wskazowki={wskazowki}
          />
        )}
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------
   PASEK AWARII ZAPISU
   --------------------------------------------------------------- */
function PasekAwarii({ rodzaj, awaria }) {
  const info = OPIS_MAGAZYNU[rodzaj];
  if (!info) return null;
  if (info.trwale && !awaria) return null;

  const alarm = !info.trwale || awaria;
  return (
    <div
      style={{
        margin: "0 16px 14px",
        padding: "11px 13px",
        background: alarm ? "#F7DED9" : C.card,
        border: `1px solid ${alarm ? C.hot : C.line}`,
        color: alarm ? C.hot : C.inkSoft,
        fontSize: 13,
        lineHeight: 1.5,
      }}
    >
      <strong style={{ ...mono, fontSize: 11, letterSpacing: "0.08em", display: "block", marginBottom: 4 }}>
        ZAPIS: {info.etykieta.toUpperCase()}
      </strong>
      {info.opis}
      {awaria?.szczegol && (
        <div style={{ ...mono, fontSize: 10, marginTop: 6, opacity: 0.75 }}>{awaria.szczegol}</div>
      )}
    </div>
  );
}

  const slowo =
    liczba === 1 ? "SESJA"
      : liczba % 10 >= 2 && liczba % 10 <= 4 && (liczba < 10 || liczba > 20) ? "SESJE"

    <div style={{ borderBottom: `2px solid ${C.ink}`, padding: "18px 16px 12px", paddingTop: "calc(18px + env(safe-area-inset-top, 0px))", marginBottom: 16 }}>

          <Logo rozmiar={34} />

            <h1
              style={{
                ...display, margin: 0, fontSize: 26, fontWeight: 600, textTransform: "uppercase",
                display: "inline-flex", gap: "0.3em",
                borderTop: `1.5px solid ${C.signal}`, borderBottom: `1.5px solid ${C.signal}`,
                padding: "5px 0 4px", lineHeight: 1.1,
              }}
            >
              {["N", "E", "M", "E", "A"].map((litera, i) => (
                <span key={i}>{litera}</span>
              ))}
            </h1>
            <div style={{ ...mono, fontSize: 9.5, color: C.steel, marginTop: 4, letterSpacing: "0.09em" }}>
              THE LION FALLS. THE HYDRA WAITS.
            </div>
          </span>
        </span>
        <span style={{ display: "flex", alignItems: "center", gap: 12 }}>
          <span style={{ ...mono, fontSize: 11, color: C.steel, letterSpacing: "0.1em" }}>{liczba} {slowo}</span>
          <button
            onClick={zmienMotyw}
            className="dt-focus"
            aria-label={`Motyw: ${MOTYWY[motyw].nazwa}. Stuknij, aby zmienić.`}
            style={{ background: "none", border: "none", padding: 2, cursor: "pointer", lineHeight: 0 }}
          >
            <span style={{ display: "inline-block", width: 15, height: 15, background: C.ink, border: `1px solid ${C.steel}` }} />
          </button>
        </span>
      </div>
      {widok !== "sesja" && (
        <div style={{ display: "flex", gap: 14, marginTop: 10 }}>
          {[["start", "Trening"], ["historia", "Historia"], ["import", "Wklej"], ["chmura", "Kopia"]].map(([k, etykieta]) => (
            <button
              key={k}
              onClick={() => setWidok(k)}
              className="dt-focus"
              style={{
                ...mono, background: "none", border: "none", padding: "2px 0", cursor: "pointer",
                fontSize: 12, letterSpacing: "0.09em", textTransform: "uppercase",
                color: widok === k ? C.ink : C.steel,

                fontWeight: widok === k ? 600 : 400,
              }}

              {etykieta}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------------
   STOPER PRZERWY
   --------------------------------------------------------------- */
function Stoper({ przerwa, przerwaPo }) {
  const [koniec, setKoniec] = useState(null);
  const [teraz, setTeraz] = useState(Date.now());
  const [etykieta, setEtykieta] = useState("");

  useEffect(() => {
    if (!koniec) return;
    const i = setInterval(() => setTeraz(Date.now()), 250);
    return () => clearInterval(i);
  }, [koniec]);

  const pozostalo = koniec ? (koniec - teraz) / 1000 : 0;
  const skonczone = koniec && pozostalo <= 0;

  const uruchom = (sekundy, opis) => {
    setEtykieta(opis);
    setKoniec(Date.now() + sekundy * 1000);
    setTeraz(Date.now());
    if (navigator.vibrate) navigator.vibrate(30);
  };

  if (koniec) {
    return (
      <button
        onClick={() => setKoniec(null)}
        className="dt-focus"
        style={{
          ...mono, width: "100%", marginTop: 10, cursor: "pointer",
          background: skonczone ? C.ok : C.ink, color: C.naSygnale, border: "none",
          padding: "13px 0", fontSize: 15, fontWeight: 700, letterSpacing: "0.06em",
        }}
      >
        {skonczone ? `✓ ${etykieta.toUpperCase()} — KONIEC` : `${etykieta.toUpperCase()}  ${mmss(pozostalo)}`}
      </button>
    );
  }

  return (
    <div style={{ display: "flex", gap: 7, marginTop: 10 }}>
      <button
        onClick={() => uruchom(przerwa, "przerwa")}
        className="dt-focus"
        style={{ ...mono, flex: 1, background: "transparent", color: C.signal, border: `1px solid ${C.signal}`, padding: "11px 0", fontSize: 11, letterSpacing: "0.05em", cursor: "pointer", fontWeight: 600 }}
      >
        ⏱ SERIA {mmss(przerwa)}
      </button>
      {przerwaPo > 0 && (
        <button
          onClick={() => uruchom(przerwaPo, "po ćwiczeniu")}
          className="dt-focus"
          style={{ ...mono, flex: 1, background: "transparent", color: C.steel, border: `1px solid ${C.line}`, padding: "11px 0", fontSize: 11, letterSpacing: "0.05em", cursor: "pointer" }}
        >
          ⏱ ĆWICZENIE {mmss(przerwaPo)}
        </button>
      )}
    </div>
  );
}

/* ---------------------------------------------------------------
   SESJA TRENINGOWA
   --------------------------------------------------------------- */
function Sesja({ sesja, setSesja, wskazowka, zapiszWskazowki, nadpisania, zapiszNadpisanie, dodane, dodajCwiczenie, usunCwiczenie, kolejnosc, zapiszKolejnosc, ostatnieDlaCwiczenia, zapiszSesje, anuluj }) {
  const plan = PLANY[sesja.plan];
  const [pokazWybierak, setPokazWybierak] = useState(false);
  const bazowe = [
    ...plan.cwiczenia,
    ...dodane.map((id) => BAZA_MAPA[id]).filter(Boolean),
  ];
  const cwiczeniaSesji = (() => {
    if (!kolejnosc.length) return bazowe;
    const mapa = Object.fromEntries(bazowe.map((c) => [c.id, c]));
    const ulozone = kolejnosc.map((id) => mapa[id]).filter(Boolean);
    const brakujace = bazowe.filter((c) => !kolejnosc.includes(c.id));
    return [...ulozone, ...brakujace];
  })();

  const przesun = (i, kierunek) => {
    const j = i + kierunek;
    if (j < 0 || j >= cwiczeniaSesji.length) return;
    const idki = cwiczeniaSesji.map((c) => c.id);
    [idki[i], idki[j]] = [idki[j], idki[i]];
    zapiszKolejnosc(sesja.plan, idki);
  };
  const [pokazPodsumowanie, setPokazPodsumowanie] = useState(false);

  const wpisCwiczenia = (cwId) => {
    const w = sesja.wpisy[cwId];
    if (Array.isArray(w)) return { serie: w, strony: false };
    return w || { serie: [], strony: false };
  };

  const ustawWpis = (cwId, nowyWpis) => {
    setSesja({ ...sesja, wpisy: { ...sesja.wpisy, [cwId]: nowyWpis } });
  };

  const ustawSerie = (cwId, idx, pole, wartosc) => {
    const wpis = wpisCwiczenia(cwId);
    const serie = [...wpis.serie];
    while (serie.length <= idx) serie.push(pusteSerie());
    serie[idx] = { ...pusteSerie(), ...serie[idx], [pole]: wartosc };
    ustawWpis(cwId, { ...wpis, serie });
  };

  const przelaczStrony = (cwId) => {
    const wpis = wpisCwiczenia(cwId);
    ustawWpis(cwId, { ...wpis, strony: !wpis.strony });
  };

  const przelaczRozgrzewke = (id) => {
    const lista = sesja.rozgrzewka || [];
    setSesja({ ...sesja, rozgrzewka: lista.includes(id) ? lista.filter((x) => x !== id) : [...lista, id] });
  };

  const dodajSerie = (cwId) => {
    const wpis = wpisCwiczenia(cwId);
    ustawWpis(cwId, { ...wpis, dodatkowe: (wpis.dodatkowe || 0) + 1 });
  };

  const usunSerie = (cwId) => {
    const wpis = wpisCwiczenia(cwId);
    if (!wpis.dodatkowe) return;
    const serie = [...wpis.serie];
    serie.pop();
    ustawWpis(cwId, { ...wpis, dodatkowe: wpis.dodatkowe - 1, serie });
  };

  const tekstPodsumowania = () => {
    const linie = [`${plan.nazwa} — ${formatData(sesja.data)}`, ""];
    cwiczeniaSesji.forEach((cw) => {
      const wpis = wpisCwiczenia(cw.id);
      const serie = wpis.serie.filter(wypelniona);
      if (!serie.length) return;
      linie.push(`${cw.nazwa}: ${serie.map((s) => opisSerii(cw, s, wpis.strony)).join("  ")}`);
    });
    if (sesja.notatka) linie.push("", `Notatka: ${sesja.notatka}`);
    return linie.join("\n");
  };

  return (
    <div style={{ padding: "0 16px" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 4 }}>
        <h2 style={{ ...display, margin: 0, fontSize: 27, fontWeight: 700, textTransform: "uppercase" }}>{plan.nazwa}</h2>
        <button onClick={anuluj} className="dt-focus" style={{ ...mono, background: "none", border: "none", color: C.steel, fontSize: 12, cursor: "pointer", padding: 4 }}>
          ✕ WYJDŹ
        </button>
      </div>
      <div style={{ ...mono, fontSize: 11, color: C.steel, marginBottom: 18 }}>{formatData(sesja.data).toUpperCase()}</div>

      <Wskazowki plan={sesja.plan} tekst={wskazowka} zapisz={zapiszWskazowki} />

      <Rozgrzewka zaznaczone={sesja.rozgrzewka || []} przelacz={przelaczRozgrzewke} />

      {cwiczeniaSesji.map((cw, i) => (
        <Cwiczenie
          key={cw.id}
          numer={i + 1}
          cw={cw}
          nadpisanie={nadpisania[cw.id]}
          zapiszNadpisanie={zapiszNadpisanie}
          dodatkowe={dodane.includes(cw.id)}
          wGore={i > 0 ? () => przesun(i, -1) : null}
          wDol={i < cwiczeniaSesji.length - 1 ? () => przesun(i, 1) : null}
          usunZPlanu={() => usunCwiczenie(sesja.plan, cw.id)}
          wpis={wpisCwiczenia(cw.id)}
          ustawSerie={ustawSerie}
          przelaczStrony={przelaczStrony}
          dodajSerie={dodajSerie}
          usunSerie={usunSerie}
          ostatnie={ostatnieDlaCwiczenia(cw.id, sesja.id)}
        />
      ))}

      <button
        onClick={() => setPokazWybierak(true)}
        className="dt-focus"
        style={{
          ...mono, display: "flex", alignItems: "center", justifyContent: "center", gap: 9,
          background: C.pole, border: `1px solid ${C.signal}`, color: C.signal,
          fontSize: 12.5, fontWeight: 700, letterSpacing: "0.09em",
          padding: "15px 0", width: "100%", cursor: "pointer", marginBottom: 22,
        }}
      >
        <span style={{ fontSize: 17, lineHeight: 1, fontWeight: 400 }}>+</span> DODAJ ĆWICZENIE
      </button>

      {pokazWybierak && (
        <Wybierak
          juzWPlanie={[...plan.cwiczenia.map((c) => c.id), ...dodane]}
          nazwyWPlanie={plan.cwiczenia.map((c) => c.nazwa)}
          wybierz={(id) => { dodajCwiczenie(sesja.plan, id); setPokazWybierak(false); }}
          zamknij={() => setPokazWybierak(false)}
        />
      )}

      <div style={{ marginTop: 22 }}>
        <label style={{ ...mono, fontSize: 11, letterSpacing: "0.1em", color: C.steel, display: "block", marginBottom: 6 }}>NOTATKA</label>
        <textarea
          value={sesja.notatka || ""}
          onChange={(e) => setSesja({ ...sesja, notatka: e.target.value })}
          placeholder="Jak się czuły lędźwie, barki, kolana? Co zmienić następnym razem?"
          className="dt-focus"
          rows={3}
          style={{ ...body, width: "100%", background: C.card, border: `1px solid ${C.line}`, padding: 11, fontSize: 14, color: C.ink, resize: "vertical" }}
        />
      </div>

      <button
        onClick={() => zapiszSesje(sesja)}
        className="dt-focus"
        style={{ ...display, width: "100%", marginTop: 18, background: C.ink, color: C.paper, border: "none", padding: "17px 0", fontSize: 20, fontWeight: 600, letterSpacing: "0.06em", textTransform: "uppercase", cursor: "pointer" }}
      >
        Zapisz trening
      </button>

      <button
        onClick={() => setPokazPodsumowanie(!pokazPodsumowanie)}
        className="dt-focus"
        style={{ ...mono, background: "none", border: "none", color: C.signal, fontSize: 12, padding: "14px 0", cursor: "pointer" }}
      >
        {pokazPodsumowanie ? "UKRYJ PODSUMOWANIE" : "PODSUMOWANIE DO SKOPIOWANIA"}
      </button>

      {pokazPodsumowanie && (
        <textarea
          readOnly
          value={tekstPodsumowania()}
          onFocus={(e) => e.target.select()}
          rows={10}
          style={{ ...mono, width: "100%", background: C.card, border: `1px solid ${C.line}`, padding: 11, fontSize: 12, color: C.inkSoft, lineHeight: 1.6 }}
        />
      )}
    </div>
  );
}

/* ---------------------------------------------------------------
   WSKAZÓWKI NA NASTĘPNY TRENING
   --------------------------------------------------------------- */
function Wskazowki({ plan, tekst, zapisz }) {
  const [edycja, setEdycja] = useState(false);
  const [potwierdzKasowanie, setPotwierdzKasowanie] = useState(false);
  const [roboczy, setRoboczy] = useState(tekst);

  useEffect(() => { setRoboczy(tekst); }, [tekst]);

  const zatwierdz = () => {
    zapisz(plan, roboczy);
    setEdycja(false);
    setPotwierdzKasowanie(false);
  };

  const kasuj = () => {
    if (!potwierdzKasowanie) {
      setPotwierdzKasowanie(true);
      return;
    }
    setRoboczy("");
    zapisz(plan, "");
    setPotwierdzKasowanie(false);
    setEdycja(false);
  };

  if (!edycja && !tekst) {
    return (
      <button
        onClick={() => setEdycja(true)}
        className="dt-focus"
        style={{
          ...mono, display: "flex", alignItems: "center", justifyContent: "center", gap: 9,
          background: C.pole, border: `1px solid ${C.signal}`, color: C.signal,
          fontSize: 12.5, fontWeight: 700, letterSpacing: "0.09em",
          padding: "14px 0", width: "100%", cursor: "pointer", marginBottom: 20,
        }}
      >
        <span style={{ fontSize: 17, lineHeight: 1, fontWeight: 400 }}>+</span> WSKAZÓWKI NA TEN TRENING
      </button>
    );
  }

  return (
    <div style={{ marginBottom: 20, background: C.card, border: `1px solid ${C.signal}`, borderLeft: `4px solid ${C.signal}`, padding: "12px 13px" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
        <span style={{ ...mono, fontSize: 10.5, letterSpacing: "0.12em", color: C.signal, fontWeight: 700 }}>
          NA TEN TRENING
        </span>
        <button
          onClick={() => (edycja ? zatwierdz() : setEdycja(true))}
          className="dt-focus"
          style={{
            ...mono, background: "none",
            border: `1px solid ${edycja ? C.ok : C.line}`,
            color: edycja ? C.ok : C.inkSoft,
            fontSize: 11, cursor: "pointer", padding: "7px 13px", fontWeight: 700, letterSpacing: "0.08em",
          }}
        >
          {edycja ? "✓ ZAPISZ" : "EDYTUJ"}
        </button>
      </div>

      {edycja ? (
        <>
          <textarea
            value={roboczy}
            onChange={(e) => setRoboczy(e.target.value)}
            onBlur={zatwierdz}
            rows={7}
            placeholder="Wklej tu uwagi na następny raz — np. jakie ciężary podnieść."
            className="dt-focus"
            style={{ ...body, width: "100%", background: C.pole, border: `1px solid ${C.line}`, padding: 10, fontSize: 14, color: C.ink, resize: "vertical", lineHeight: 1.5 }}
          />
          <div style={{ display: "flex", gap: 7, marginTop: 9 }}>
            <button
              onMouseDown={(e) => e.preventDefault()}
              onTouchStart={(e) => e.preventDefault()}
              onClick={kasuj}
              className="dt-focus"
              style={{
                ...mono, flex: 1, cursor: "pointer", fontSize: 11, padding: "10px 0", letterSpacing: "0.04em",
                background: potwierdzKasowanie ? C.hot : "none",
                border: `1px solid ${potwierdzKasowanie ? C.hot : C.line}`,
                color: potwierdzKasowanie ? C.paper : C.steel,
                fontWeight: potwierdzKasowanie ? 700 : 400,
              }}
            >
              {potwierdzKasowanie ? "STUKNIJ PONOWNIE, ABY SKASOWAĆ" : "KASUJ TEKST"}
            </button>
            {potwierdzKasowanie && (
              <button
                onMouseDown={(e) => e.preventDefault()}
                onTouchStart={(e) => e.preventDefault()}
                onClick={() => setPotwierdzKasowanie(false)}
                className="dt-focus"
                style={{ ...mono, width: 70, background: "none", border: `1px solid ${C.line}`, color: C.steel, fontSize: 11, padding: "10px 0", cursor: "pointer" }}
              >
                NIE
              </button>
            )}
          </div>
        </>
      ) : (
        <div style={{ fontSize: 14, color: C.ink, lineHeight: 1.55, whiteSpace: "pre-wrap" }}>{tekst}</div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------------
   ROZGRZEWKA
   --------------------------------------------------------------- */
function Rozgrzewka({ zaznaczone, przelacz }) {
  const [otwarte, setOtwarte] = useState(false);
  const gotowe = zaznaczone.length;

  return (
    <div style={{ border: `1px solid ${C.line}`, background: C.card, marginBottom: 20 }}>
      <button
        onClick={() => setOtwarte(!otwarte)}
        className="dt-focus"
        style={{ width: "100%", background: "none", border: "none", padding: "13px 14px", display: "flex", justifyContent: "space-between", alignItems: "center", cursor: "pointer" }}
      >
        <span style={{ textAlign: "left" }}>
          <span style={{ ...display, fontSize: 17, fontWeight: 600, textTransform: "uppercase", display: "block" }}>Rozgrzewka i gorset</span>
          <span style={{ ...mono, fontSize: 10.5, color: C.steel, display: "block", marginTop: 2 }}>(Warm-Up &amp; Core)</span>
        </span>
        <span style={{ ...mono, fontSize: 11, color: gotowe === ROZGRZEWKA.length ? C.ok : C.steel }}>
          {gotowe}/{ROZGRZEWKA.length} {otwarte ? "▲" : "▼"}
        </span>
      </button>

      {otwarte && (
        <div style={{ padding: "0 14px 12px" }}>
          {ROZGRZEWKA.map((p) => {
            const zrobione = zaznaczone.includes(p.id);
            return (
              <button
                key={p.id}
                onClick={() => przelacz(p.id)}
                className="dt-focus"
                style={{ width: "100%", display: "flex", alignItems: "center", gap: 11, background: "none", border: "none", borderTop: `1px solid ${C.line}`, padding: "11px 0", cursor: "pointer", textAlign: "left" }}
              >
                <span style={{ width: 19, height: 19, flexShrink: 0, border: `2px solid ${zrobione ? C.ok : C.steel}`, background: zrobione ? C.ok : "transparent", color: C.paper, fontSize: 12, lineHeight: "15px", textAlign: "center", fontWeight: 700 }}>
                  {zrobione ? "✓" : ""}
                </span>
                <span style={{ flex: 1, minWidth: 0, textDecoration: zrobione ? "line-through" : "none" }}>
                  <span style={{ fontSize: 14, color: zrobione ? C.steel : C.ink }}>{p.nazwa}</span>
                  {p.detal && <span style={{ ...mono, fontSize: 11, color: C.steel, marginLeft: 8 }}>{p.detal}</span>}
                  {p.en && <span style={{ ...mono, display: "block", fontSize: 10.5, color: C.steel, marginTop: 2 }}>({p.en})</span>}
                </span>
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------------
   POJEDYNCZE ĆWICZENIE
   --------------------------------------------------------------- */
function Cwiczenie({ numer, cw, nadpisanie, zapiszNadpisanie, dodatkowe, usunZPlanu, wGore, wDol, wpis, ustawSerie, przelaczStrony, dodajSerie, usunSerie, ostatnie }) {
  const serie = wpis.serie || [];
  const [edycjaCelu, setEdycjaCelu] = useState(false);
  const [pokazOpis, setPokazOpis] = useState(false);

function Pole({ wartosc, zmien, jedn, duch }) {
  const znormalizuj = (surowa) => {
    const tekst = String(surowa ?? "").trim();
    if (tekst === "") return null;
    if (/^\d+([.,]\d+)?$/.test(tekst)) return null;
    const liczby = wyciagnijLiczby(tekst);
    return liczby.length ? String(liczby[0]) : null;
  };

  const zatwierdz = () => {
    const liczba = znormalizuj(wartosc);
    if (liczba != null) zmien(liczba);
  };

  const podglad = znormalizuj(wartosc);

  return (
    <div style={{ flex: 1, position: "relative", display: "flex", alignItems: "center" }}>
      <input
        type="text"
        inputMode="text"
        autoComplete="off"
        autoCorrect="off"
        autoCapitalize="off"
        spellCheck={false}
        value={wartosc}
        onChange={(e) => zmien(e.target.value)}
        onBlur={zatwierdz}
        onKeyDown={(e) => { if (e.key === "Enter") { zatwierdz(); e.target.blur(); } }}
        placeholder={duch != null && duch !== "" ? String(duch) : "–"}
        className="dt-focus"
        style={{ ...mono, width: "100%", background: C.pole, border: `1px solid ${C.line}`, padding: "11px 36px 11px 11px", fontSize: 16, color: C.ink, fontWeight: 600 }}
      />
      {podglad != null ? (
        <span style={{ ...mono, position: "absolute", right: 8, fontSize: 12, color: C.ok, pointerEvents: "none", fontWeight: 700, background: C.pole, paddingLeft: 4 }}>
          = {podglad}
        </span>
      ) : (
        <span style={{ ...mono, position: "absolute", right: 10, fontSize: 10, color: C.steel, pointerEvents: "none" }}>{jedn}</span>
      )}
    </div>
  );
}

/* ---------------------------------------------------------------
   IMPORT Z TEKSTU
   --------------------------------------------------------------- */
function Import({ dodajSesje, setWidok }) {
  const [tekst, setTekst] = useState("");
  const [plan, setPlan] = useState("A");
  const [data, setData] = useState(dzis());
  const [status, setStatus] = useState(null);

  const parsuj = () => {
    const cwiczenia = PLANY[plan].cwiczenia;
    const wpisy = {};
    let znalezione = 0;
    let notatka = "";
    const pominiete = [];
    const niejednoznaczne = [];

    tekst.split("\n").forEach((linia) => {
      const czysta = linia.trim();
      if (!czysta) return;
      if (/^notatka\s*:/i.test(czysta)) {
        notatka = czysta.replace(/^notatka\s*:\s*/i, "");
        return;
      }
      const podzial = czysta.indexOf(":");
      if (podzial < 0) return;
      const nazwa = czysta.slice(0, podzial).trim().toLowerCase();
      const reszta = czysta.slice(podzial + 1);

      const kandydaci = cwiczenia.filter((c) => {
        const pelna = c.nazwa.toLowerCase();
        if (pelna === nazwa) return true;
        if (nazwa.length < 8) return false;
        return pelna.startsWith(nazwa) || nazwa.startsWith(pelna);
      });

      // dokładne trafienie ma pierwszeństwo; niejednoznaczne pomijamy
      const dokladne = kandydaci.find((c) => c.nazwa.toLowerCase() === nazwa);
      const cw = dokladne || (kandydaci.length === 1 ? kandydaci[0] : null);
      if (!cw) {
        if (kandydaci.length > 1) niejednoznaczne.push(czysta.slice(0, podzial).trim());
        else pominiete.push(czysta.slice(0, podzial).trim());
        return;
      }

      const serie = [];
      const wzor = /(\d+(?:[.,]\d+)?)\s*(?:kg|s|m)?\s*[×x*]\s*(\d+(?:[.,]\d+)?)/gi;
      let dop;
      while ((dop = wzor.exec(reszta)) !== null) {
        serie.push({ ...pusteSerie(), w: dop[1].replace(",", "."), p: dop[2].replace(",", ".") });
      }
      if (!serie.length) {
        const same = reszta.match(/(\d+(?:[.,]\d+)?)\s*(?:kg|s|m)/gi);
        if (same) same.forEach((x) => serie.push({ ...pusteSerie(), w: x.replace(/[^\d.,]/g, "").replace(",", "."), p: "" }));
      }
      if (serie.length) {
        if (cw.bezPowtorzen) serie.forEach((s) => { s.p = ""; });
        wpisy[cw.id] = { serie, strony: false };
        znalezione++;
      }
    });

    return { wpisy, znalezione, notatka, pominiete, niejednoznaczne };
  };

  const zapisz = async () => {
    const { wpisy, znalezione, notatka, pominiete, niejednoznaczne } = parsuj();
    if (!znalezione) {
      setStatus({ typ: "blad", tekst: "Nie rozpoznałem żadnego ćwiczenia. Sprawdź, czy nazwy zgadzają się z planem i czy po nazwie jest dwukropek." });
      return;
    }
    const ok = await dodajSesje({
      id: `s_${Date.now()}`,
      data,
      plan,
      wpisy,
      rozgrzewka: [],
      notatka,
    });
    if (!ok) {
      setStatus({ typ: "blad", tekst: "Zapis się nie powiódł — pamięć jest niedostępna w tym oknie." });
      return;
    }
    let tekst = `Zapisano ${znalezione} ćwiczeń.`;
    if (niejednoznaczne.length) tekst += ` Nazwa niejednoznaczna, pominięto: ${niejednoznaczne.join(", ")}.`;
    if (pominiete.length) tekst += ` Nie ma w planie ${plan}: ${pominiete.join(", ")}.`;
    setStatus({ typ: niejednoznaczne.length || pominiete.length ? "uwaga" : "ok", tekst });
    setTekst("");
  };

  return (
    <div style={{ padding: "0 16px" }}>
      <p style={{ fontSize: 13.5, color: C.inkSoft, lineHeight: 1.55, marginTop: 0 }}>
        Wklej trening zapisany wcześniej w tekście — w formacie <em>nazwa ćwiczenia: 56kg×8 56kg×8</em>, każde ćwiczenie w osobnej linii.
      </p>

      <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
        {["A", "B"].map((p) => (
          <button
            key={p}
            onClick={() => setPlan(p)}
            className="dt-focus"
            style={{ ...mono, flex: 1, padding: "11px 0", fontSize: 12, cursor: "pointer", background: plan === p ? C.ink : "transparent", color: plan === p ? C.paper : C.ink, border: `1px solid ${plan === p ? C.ink : C.line}`, fontWeight: 600 }}
          >
            TRENING {p}
          </button>
        ))}
      </div>

      <input
        type="date"
        value={data}
        onChange={(e) => setData(e.target.value)}
        className="dt-focus"
        style={{ ...mono, width: "100%", padding: "11px", fontSize: 14, border: `1px solid ${C.line}`, background: C.pole, color: C.ink, marginBottom: 10 }}
      />

      <textarea
        value={tekst}
        onChange={(e) => setTekst(e.target.value)}
        rows={12}
        placeholder={"Wyciskanie hantlami na skosie: 56kg×8  56kg×8\nŚciąganie drążka: 52kg×10  52kg×10"}
        className="dt-focus"
        style={{ ...mono, width: "100%", background: C.pole, border: `1px solid ${C.line}`, padding: 11, fontSize: 13, color: C.ink, lineHeight: 1.6, resize: "vertical" }}
      />

      <button
        onClick={zapisz}
        className="dt-focus"
        style={{ ...display, width: "100%", marginTop: 12, background: C.ink, color: C.paper, border: "none", padding: "15px 0", fontSize: 18, fontWeight: 600, letterSpacing: "0.06em", textTransform: "uppercase", cursor: "pointer" }}
      >
        Wczytaj trening
      </button>

      {status && (
        <div style={{ ...mono, fontSize: 12, marginTop: 12, color: status.typ === "ok" ? C.ok : status.typ === "uwaga" ? C.hot : C.hot, lineHeight: 1.6 }}>
          {status.tekst}
        </div>
      )}

      <button
        onClick={() => setWidok("historia")}
        className="dt-focus"
        style={{ ...mono, background: "none", border: "none", color: C.signal, fontSize: 12, padding: "14px 0", cursor: "pointer" }}
      >
        PRZEJDŹ DO HISTORII →
      </button>
    </div>
  );
}

/* ---------------------------------------------------------------
   KOPIA W CHMURZE (GITHUB)
   --------------------------------------------------------------- */
function Chmura({ konfig, zapiszKonfig, wyslij, pobierz, stan, sesje, wskazowki }) {
  const [k, setK] = useState(konfig || { wlasciciel: "", repo: "", sciezka: "dane.json", galaz: "main", token: "" });
  const [pokazToken, setPokazToken] = useState(false);
  const [potwierdzenie, setPotwierdzenie] = useState(false);

  const zmien = (pole, wartosc) => {
    const nowy = { ...k, [pole]: wartosc.trim() };
    setK(nowy);
    zapiszKonfig(nowy);
  };

  const gotowy = k.token && k.wlasciciel && k.repo && k.sciezka;

  const pobierzPlik = () => {
    const tresc = JSON.stringify({ wersja: WERSJA, zapisano: new Date().toISOString(), sesje, wskazowki }, null, 2);
    const url = URL.createObjectURL(new Blob([tresc], { type: "application/json" }));
    const a = document.createElement("a");
    a.href = url;
    a.download = `dziennik-${dzis()}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  };

  const pole = (etykieta, klucz, placeholder, typ = "text") => (
    <div style={{ marginBottom: 10 }}>
      <label style={{ ...mono, fontSize: 10.5, letterSpacing: "0.1em", color: C.steel, display: "block", marginBottom: 4 }}>
        {etykieta}
      </label>
      <input
        type={typ}
        value={k[klucz] || ""}
        onChange={(e) => zmien(klucz, e.target.value)}
        placeholder={placeholder}
        autoComplete="off"
        autoCorrect="off"
        autoCapitalize="none"
        spellCheck={false}
        className="dt-focus"
        style={{ ...mono, width: "100%", background: C.pole, border: `1px solid ${C.line}`, padding: "11px", fontSize: 14, color: C.ink }}
      />
    </div>
  );

  const kolorStanu = stan.etap === "ok" ? C.ok : stan.etap === "blad" ? C.hot : C.steel;

  return (
    <div style={{ padding: "0 16px" }}>
      <p style={{ fontSize: 13.5, color: C.inkSoft, lineHeight: 1.55, marginTop: 0 }}>
        Treningi zapisują się na GitHubie po każdej sesji. Pamięć przeglądarki zostaje kopią podręczną — gdy zniknie, pobierzesz wszystko z powrotem.
      </p>

      <button
        onClick={pobierzPlik}
        className="dt-focus"
        style={{ ...mono, width: "100%", background: "transparent", color: C.ink, border: `1px solid ${C.ink}`, padding: "12px 0", fontSize: 12, letterSpacing: "0.06em", cursor: "pointer", fontWeight: 600, marginBottom: 22 }}
      >
        ⤓ POBIERZ KOPIĘ NA TELEFON ({sesje.length})
      </button>

      <div style={{ ...mono, fontSize: 10.5, letterSpacing: "0.12em", color: C.steel, marginBottom: 10, paddingBottom: 6, borderBottom: `1px solid ${C.line}` }}>
        SYNCHRONIZACJA Z GITHUBEM
      </div>

      {pole("WŁAŚCICIEL (TWÓJ LOGIN)", "wlasciciel", "np. norbert")}
      {pole("REPOZYTORIUM (PRYWATNE)", "repo", "np. dziennik-dane")}
      {pole("PLIK", "sciezka", "dane.json")}
      {pole("GAŁĄŹ", "galaz", "main")}

      <div style={{ marginBottom: 10 }}>
        <label style={{ ...mono, fontSize: 10.5, letterSpacing: "0.1em", color: C.steel, display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
          <span>TOKEN DOSTĘPU</span>
          <button
            onClick={() => setPokazToken(!pokazToken)}
            className="dt-focus"
            style={{ ...mono, background: "none", border: "none", color: C.signal, fontSize: 10.5, cursor: "pointer", padding: 0 }}
          >
            {pokazToken ? "UKRYJ" : "POKAŻ"}
          </button>
        </label>
        <input
          type={pokazToken ? "text" : "password"}
          value={k.token || ""}
          onChange={(e) => zmien("token", e.target.value)}
          placeholder="github_pat_…"
          autoComplete="off"
          autoCorrect="off"
          autoCapitalize="none"
          spellCheck={false}
          className="dt-focus"
          style={{ ...mono, width: "100%", background: C.pole, border: `1px solid ${C.line}`, padding: "11px", fontSize: 14, color: C.ink }}
        />
      </div>

      <div style={{ display: "flex", gap: 8, marginTop: 16 }}>
        <button
          onClick={wyslij}
          disabled={!gotowy}
          className="dt-focus"
          style={{ ...mono, flex: 1, background: gotowy ? C.ink : C.line, color: gotowy ? C.paper : C.steel, border: "none", padding: "14px 0", fontSize: 12, letterSpacing: "0.06em", cursor: gotowy ? "pointer" : "default", fontWeight: 600 }}
        >
          ↑ WYŚLIJ
        </button>
        <button
          onClick={() => (potwierdzenie ? (pobierz(), setPotwierdzenie(false)) : setPotwierdzenie(true))}
          disabled={!gotowy}
          className="dt-focus"
          style={{ ...mono, flex: 1, background: potwierdzenie ? C.hot : "transparent", color: potwierdzenie ? C.naSygnale : gotowy ? C.ink : C.steel, border: `1px solid ${potwierdzenie ? C.hot : C.line}`, padding: "14px 0", fontSize: 12, letterSpacing: "0.06em", cursor: gotowy ? "pointer" : "default", fontWeight: 600 }}
        >
          {potwierdzenie ? "NADPISAĆ?" : "↓ POBIERZ"}
        </button>
      </div>

      {potwierdzenie && (
        <div style={{ ...mono, fontSize: 11, color: C.hot, marginTop: 8, lineHeight: 1.5 }}>
          Pobranie zastąpi dane w telefonie tym, co leży na GitHubie. Stuknij ponownie, aby potwierdzić.
        </div>
      )}

      {stan.tekst && (
        <div style={{ ...mono, fontSize: 12, marginTop: 14, color: kolorStanu, lineHeight: 1.6 }}>
          {stan.tekst}
        </div>
      )}

      <div style={{ fontSize: 12.5, color: C.steel, marginTop: 24, lineHeight: 1.6, paddingTop: 14, borderTop: `1px solid ${C.line}` }}>
        Token trzymany jest w pamięci tej przeglądarki. Użyj tokena drobnoziarnistego z dostępem wyłącznie do repozytorium z danymi i uprawnieniem „Contents: Read and write". W razie czego unieważnisz go w ustawieniach GitHuba.
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------
   HISTORIA
   --------------------------------------------------------------- */
function Historia({ sesje, usunSesje, setWidok }) {
  const [rozwiniete, setRozwiniete] = useState(null);
  const [doUsuniecia, setDoUsuniecia] = useState(null);

  if (!sesje.length) {
    return (
      <div style={{ padding: "0 16px" }}>
        <p style={{ fontSize: 14, color: C.inkSoft, lineHeight: 1.55 }}>
          Nie ma jeszcze żadnych zapisanych treningów.
        </p>
        <button onClick={() => setWidok("start")} className="dt-focus" style={{ ...mono, background: "none", border: "none", color: C.signal, fontSize: 12, padding: "6px 0", cursor: "pointer" }}>
          ← WRÓĆ DO TRENINGÓW
        </button>
      </div>
    );
  }

  return (
    <div style={{ padding: "0 16px" }}>
      {sesje.map((s) => {
        const plan = PLANY[s.plan];
        if (!plan) return null;
        const otwarte = rozwiniete === s.id;
        const dane = plan.cwiczenia
          .map((cw) => {
            const w = s.wpisy?.[cw.id];
            const serie = Array.isArray(w) ? w : w?.serie;
            const strony = Array.isArray(w) ? false : w?.strony;
            const wypelnione = (serie || []).filter(wypelniona);
            return wypelnione.length ? { cw, serie: wypelnione, strony } : null;
          })
          .filter(Boolean);

        return (
          <div key={s.id} style={{ borderBottom: `1px solid ${C.line}`, padding: "13px 0" }}>
            <button
              onClick={() => setRozwiniete(otwarte ? null : s.id)}
              className="dt-focus"
              style={{ width: "100%", background: "none", border: "none", padding: 0, display: "flex", justifyContent: "space-between", alignItems: "baseline", cursor: "pointer", textAlign: "left" }}
            >
              <span>
                <span style={{ ...display, fontSize: 20, fontWeight: 700, textTransform: "uppercase" }}>{plan.nazwa}</span>
                <span style={{ fontSize: 13, color: C.inkSoft, marginLeft: 10 }}>{formatData(s.data)}</span>
              </span>
              <span style={{ ...mono, fontSize: 11, color: C.steel }}>{dane.length} ĆW. {otwarte ? "▲" : "▼"}</span>
            </button>

            {otwarte && (
              <div style={{ marginTop: 11 }}>
                {dane.map(({ cw, serie, strony }) => (
                  <div key={cw.id} style={{ marginBottom: 9 }}>
                    <div style={{ fontSize: 13.5, fontWeight: 500 }}>{cw.nazwa}</div>
                    <div style={{ ...mono, fontSize: 12, color: C.inkSoft, marginTop: 2, lineHeight: 1.6 }}>
                      {serie.map((x) => opisSerii(cw, x, strony)).join("   ")}
                    </div>
                  </div>
                ))}
                {s.notatka && (
                  <div style={{ fontSize: 13, color: C.inkSoft, marginTop: 10, paddingLeft: 10, borderLeft: `2px solid ${C.signal}`, lineHeight: 1.5 }}>
                    {s.notatka}
                  </div>
                )}
                {doUsuniecia === s.id ? (
                  <div style={{ display: "flex", gap: 14, marginTop: 12, alignItems: "center" }}>
                    <span style={{ ...mono, fontSize: 11, color: C.hot }}>USUNĄĆ NA STAŁE?</span>
                    <button onClick={() => { usunSesje(s.id); setDoUsuniecia(null); }} className="dt-focus" style={{ ...mono, background: C.hot, color: C.naSygnale, border: "none", padding: "6px 12px", fontSize: 11, cursor: "pointer" }}>
                      TAK, USUŃ
                    </button>
                    <button onClick={() => setDoUsuniecia(null)} className="dt-focus" style={{ ...mono, background: "none", border: "none", color: C.steel, fontSize: 11, cursor: "pointer" }}>
                      ANULUJ
                    </button>
                  </div>
                ) : (
                  <button onClick={() => setDoUsuniecia(s.id)} className="dt-focus" style={{ ...mono, background: "none", border: "none", color: C.steel, fontSize: 11, padding: "10px 0 0", cursor: "pointer" }}>
                    USUŃ TEN TRENING
                  </button>
                )}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

function Wybierak({ juzWPlanie, nazwyWPlanie, wybierz, zamknij }) {
  const [szukaj, setSzukaj] = useState("");
  const [rozwiniete, setRozwiniete] = useState(null);

  const norm = (t) =>
    (t || "")
      .toLowerCase()
      .replace(/ą/g, "a").replace(/ć/g, "c").replace(/ę/g, "e").replace(/ł/g, "l")
      .replace(/ń/g, "n").replace(/ó/g, "o").replace(/ś/g, "s").replace(/ż|ź/g, "z");

  const q = norm(szukaj.trim());
  const pasuje = (c) => !q || norm(c.nazwa).includes(q) || norm(c.en).includes(q);
  const wyniki = BAZA.filter(pasuje);

  return (
    <div
      onClick={zamknij}
      style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.72)", zIndex: 90, display: "flex", alignItems: "flex-end", justifyContent: "center" }}
    >
      <div
        onClick={(e) => e.stopPropagation()}
        style={{ background: C.paper, borderTop: `2px solid ${C.signal}`, width: "100%", maxWidth: 560, maxHeight: "88vh", display: "flex", flexDirection: "column" }}
      >
        <div style={{ padding: "14px 15px 12px", borderBottom: `1px solid ${C.line}` }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 11 }}>
            <span style={{ ...mono, fontSize: 11, letterSpacing: "0.12em", color: C.signal, fontWeight: 700 }}>
              BAZA ĆWICZEŃ · {BAZA.length}
            </span>
            <button
              onClick={zamknij}
              className="dt-focus"
              style={{ ...mono, background: "none", border: `1px solid ${C.line}`, color: C.inkSoft, fontSize: 11, padding: "7px 13px", cursor: "pointer", fontWeight: 700 }}
            >
              ZAMKNIJ
            </button>
          </div>
          <input
            value={szukaj}
            onChange={(e) => setSzukaj(e.target.value)}
            placeholder="Szukaj — po polsku lub po angielsku"
            className="dt-focus"
            style={{ ...body, width: "100%", background: C.pole, border: `1px solid ${C.line}`, padding: "12px 11px", fontSize: 14.5, color: C.ink }}
          />
        </div>

        <div style={{ overflowY: "auto", padding: "4px 15px 20px", paddingBottom: "calc(20px + env(safe-area-inset-bottom, 0px))", WebkitOverflowScrolling: "touch" }}>
          {wyniki.length === 0 && (
            <div style={{ ...mono, fontSize: 12, color: C.steel, padding: "26px 0", textAlign: "center" }}>
              NIC NIE ZNALEZIONO
            </div>
          )}

          {GRUPY.map((g) => {
            const wGrupie = wyniki.filter((c) => c.grupa === g.id);
            if (!wGrupie.length) return null;
            return (
              <div key={g.id} style={{ marginTop: 16 }}>
                <div style={{ ...mono, fontSize: 10, letterSpacing: "0.12em", color: C.signal, marginBottom: 8, fontWeight: 700 }}>
                  {g.nazwa.toUpperCase()}
                  {g.en && <span style={{ color: C.steel, fontWeight: 400 }}> · {g.en.toUpperCase()}</span>}
                </div>
                {wGrupie.map((c) => {
                  const jest = juzWPlanie.includes(c.id) || nazwyWPlanie.includes(c.nazwa);
                  const otwarte = rozwiniete === c.id;
                  return (
                    <div key={c.id} style={{ background: C.card, border: `1px solid ${C.line}`, marginBottom: 8, padding: "11px 12px" }}>
                      <div style={{ display: "flex", gap: 10, alignItems: "flex-start" }}>
                        <div style={{ flex: 1, minWidth: 0 }}>
                          <div style={{ ...display, fontSize: 16, fontWeight: 600, lineHeight: 1.2, color: jest ? C.steel : C.ink }}>
                            {c.nazwa}
                          </div>
                          <div style={{ ...mono, fontSize: 10.5, color: C.steel, marginTop: 2 }}>({c.en})</div>
                        </div>
                        <button
                          onClick={() => setRozwiniete(otwarte ? null : c.id)}
                          className="dt-focus"
                          style={{ ...mono, background: otwarte ? C.signal : "none", border: `1px solid ${otwarte ? C.signal : C.line}`, color: otwarte ? C.paper : C.steel, width: 30, height: 30, flexShrink: 0, cursor: "pointer", fontSize: 14, fontWeight: 700, padding: 0 }}
                        >
                          ?
                        </button>
                        <button
                          onClick={() => !jest && wybierz(c.id)}
                          disabled={jest}
                          className="dt-focus"
                          style={{
                            ...mono, width: 74, height: 30, flexShrink: 0, fontSize: 11, fontWeight: 700, letterSpacing: "0.06em", padding: 0,
                            cursor: jest ? "default" : "pointer",
                            background: jest ? "none" : C.pole,
                            border: `1px solid ${jest ? C.line : C.signal}`,
                            color: jest ? C.steel : C.signal,
                          }}
                        >
                          {jest ? "W PLANIE" : "+ DODAJ"}
                        </button>
                      </div>

                      {otwarte && (
                        <div style={{ marginTop: 10, borderTop: `1px solid ${C.line}`, paddingTop: 10 }}>
                          <div style={{ ...mono, fontSize: 9.5, color: C.signal, letterSpacing: "0.08em", marginBottom: 4 }}>TECHNIKA</div>
                          <div style={{ fontSize: 12.5, lineHeight: 1.55, color: C.ink }}>{c.opis}</div>
                          <div style={{ ...mono, fontSize: 9.5, color: C.signal, letterSpacing: "0.08em", margin: "9px 0 4px" }}>PARTIE</div>
                          <div style={{ fontSize: 12.5, lineHeight: 1.55, color: C.inkSoft }}>{c.opisPartie}</div>
                          {c.uwaga && (
                            <>
                              <div style={{ ...mono, fontSize: 9.5, color: C.hot, letterSpacing: "0.08em", margin: "9px 0 4px" }}>UWAGA</div>
                              <div style={{ fontSize: 12.5, lineHeight: 1.55, color: C.ink }}>{c.uwaga}</div>
                            </>
                          )}
                          <div style={{ ...mono, fontSize: 10.5, color: C.steel, marginTop: 9 }}>
                            PROPOZYCJA: {c.serie} × {c.zakres} · PRZERWA {mmss(c.przerwa)}
                          </div>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<DziennikTreningowy />);
</script>
</body>
</html>
